<html lang="kk">
<head>

    <title>Мәлімет</title>

        {
            border: 1px solid teal;
            border-collapse: collapse;
        }

        td, th {
            border: 1px solid teal;
            padding: 8px 14px;
        }

        th {
            background-color: teal;
            color: white;
        }
    </style>
</head>
<body>
        <tr>
            <th>Көрсеткіш</th>
            <th>Мәні</th>
        </tr>

            <td>Қала</td>
            <td>Астана</td>
        </tr>
        <tr>
            <td>Ашылған жылы</td>
            <td>2009</td>
        </tr>
        <tr>
            <td>Шатыры</td>
            <td>Жылжымалы</td>
        </tr>
        <tr>
            <td>Үй алаңы</td>
            <td>«Астана» ФК, Қазақстан құрамасы</td>
        </tr>
</body>
</html>
